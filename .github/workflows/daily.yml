name: tech-news
on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch: {}   # manual test button
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send translated tech news to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PYEOF'
          import os, re, json, time, html, urllib.request, urllib.parse, datetime, email.utils
          import xml.etree.ElementTree as ET

          # ---- settings you can change ----
          FEEDS = [
              ("The Verge", "https://www.theverge.com/rss/index.xml"),
              ("Ars Technica", "https://feeds.arstechnica.com/arstechnica/index"),
              ("TechCrunch", "https://techcrunch.com/feed/"),
              ("Wired", "https://www.wired.com/feed/rss"),
              ("BBC", "https://feeds.bbci.co.uk/news/technology/rss.xml"),
          ]
          KEYWORDS = []      # e.g. ["AI", "Apple", "Google"]; empty list = all tech news
          MAX_ITEMS = 3      # max news per run (the newest ones)
          HOURS = 6          # look back window (safe against GitHub delays)
          HASHTAG = "#فناوری"
          # ---------------------------------

          RLM = "\u200f"
          SENT_FILE = "sent.json"
          UTC = datetime.timezone.utc

          def local(tag):
              return tag.rsplit("}", 1)[-1]

          def clean(text, limit=300):
              t = html.unescape(re.sub(r"<[^>]+>", " ", text or ""))
              t = re.sub(r"\s+", " ", t).strip()
              if len(t) > limit:
                  cut = t[:limit]
                  end = max(cut.rfind(". "), cut.rfind("! "), cut.rfind("? "))
                  t = cut[: end + 1] if end > 80 else cut.rsplit(" ", 1)[0] + "…"
              return t

          def parse_date(raw):
              if not raw:
                  return None
              try:
                  d = email.utils.parsedate_to_datetime(raw)
              except Exception:
                  try:
                      d = datetime.datetime.fromisoformat(raw.strip().replace("Z", "+00:00"))
                  except Exception:
                      return None
              return d if d.tzinfo else d.replace(tzinfo=UTC)

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          def fetch(name, url):
              root = ET.fromstring(get(url))
              items = []
              for el in root.iter():
                  if local(el.tag) not in ("item", "entry"):
                      continue
                  title = link = raw = desc = None
                  for ch in el:
                      n = local(ch.tag)
                      if n == "title":
                          title = (ch.text or "").strip()
                      elif n == "link":
                          if ch.get("href"):
                              if ch.get("rel", "alternate") == "alternate" or not link:
                                  link = ch.get("href").strip()
                          elif ch.text and not link:
                              link = ch.text.strip()
                      elif n in ("pubDate", "published", "updated") and not raw:
                          raw = ch.text
                      elif n in ("description", "summary") and not desc:
                          desc = ch.text
                  if title and link:
                      items.append((parse_date(raw), title, clean(desc), link, name))
              return items

          def translate(text):
              """English -> Persian. Tries two free services; returns None if both fail."""
              if not text:
                  return ""
              try:  # 1) Google Translate public endpoint (unofficial)
                  q = urllib.parse.quote(text)
                  url = ("https://translate.googleapis.com/translate_a/single"
                         f"?client=gtx&sl=en&tl=fa&dt=t&q={q}")
                  data = json.loads(get(url))
                  out = "".join(part[0] for part in data[0] if part and part[0])
                  if out.strip():
                      return out.strip()
              except Exception as e:
                  print("google translate failed:", e)
              try:  # 2) MyMemory (free, limited daily quota)
                  q = urllib.parse.quote(text[:450])
                  data = json.loads(get(f"https://api.mymemory.translated.net/get?q={q}&langpair=en|fa"))
                  out = data["responseData"]["translatedText"]
                  if out and "MYMEMORY" not in out.upper():
                      return out.strip()
              except Exception as e:
                  print("mymemory failed:", e)
              return None

          def load_sent():
              try:
                  return json.load(open(SENT_FILE))
              except Exception:
                  return []

          def collect(sent):
              now = datetime.datetime.now(UTC)
              limit = now - datetime.timedelta(hours=HOURS)
              found = []
              for name, url in FEEDS:
                  try:
                      found += fetch(name, url)
                  except Exception as e:
                      print("feed failed:", url, e)
              found = [x for x in found if x[0] and x[0] >= limit and x[3] not in sent]
              if KEYWORDS:
                  found = [x for x in found if any(k.lower() in x[1].lower() for k in KEYWORDS)]
              found.sort(key=lambda x: x[0], reverse=True)
              seen, uniq = set(), []
              for x in found:
                  if x[3] not in seen:
                      seen.add(x[3]); uniq.append(x)
              return uniq

          def build_post(title, desc, link, source):
              t_fa = translate(title)
              time.sleep(1)
              d_fa = translate(desc) if desc else ""
              time.sleep(1)
              lines = []
              if t_fa:
                  lines.append(f"{RLM}📰 {t_fa}")
                  if d_fa:
                      lines += ["", f"{RLM}{d_fa}"]
              else:  # translation failed: keep the English so nothing is lost
                  lines.append(f"📰 {title}")
                  if desc:
                      lines += ["", desc]
              lines += ["", f"{RLM}🔗 منبع: {source}", link, "", f"{RLM}{HASHTAG}"]
              return "\n".join(lines)

          def send(text):
              token, chat = os.environ["TELEGRAM_BOT_TOKEN"], os.environ["TELEGRAM_CHAT_ID"]
              data = json.dumps({"chat_id": chat, "text": text[:4000], "disable_web_page_preview": False}).encode()
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=data, headers={"Content-Type": "application/json"},
              )
              urllib.request.urlopen(req, timeout=30).read()

          if __name__ == "__main__":
              sent = load_sent()
              items = collect(sent)
              for _, title, desc, link, source in items[:MAX_ITEMS]:
                  send(build_post(title, desc, link, source))
              sent += [x[3] for x in items]
              json.dump(sent[-500:], open(SENT_FILE, "w"))
              print("sent", min(len(items), MAX_ITEMS))
          PYEOF
      - name: Remember what was sent
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add sent.json
          git diff --cached --quiet || (git commit -m "update sent list" && git push)
