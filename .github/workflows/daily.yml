name: tech-news
on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch: {}   # manual test button
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send tech news to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, datetime, email.utils
          import xml.etree.ElementTree as ET

          # ---- settings you can change ----
          FEEDS = [
              "https://www.theverge.com/rss/index.xml",
              "https://feeds.arstechnica.com/arstechnica/index",
              "https://techcrunch.com/feed/",
              "https://www.wired.com/feed/rss",
              "https://feeds.bbci.co.uk/news/technology/rss.xml",
          ]
          KEYWORDS = []      # e.g. ["AI", "Apple", "Google"]; empty list = all tech news
          MAX_ITEMS = 3      # max news per run (the newest ones)
          HOURS = 6          # look back window (safe against GitHub delays)
          # ---------------------------------

          RLM = "\u200f"
          SENT_FILE = "sent.json"
          UTC = datetime.timezone.utc

          def local(tag):
              return tag.rsplit("}", 1)[-1]

          def parse_date(raw):
              if not raw:
                  return None
              try:
                  d = email.utils.parsedate_to_datetime(raw)
              except Exception:
                  try:
                      d = datetime.datetime.fromisoformat(raw.strip().replace("Z", "+00:00"))
                  except Exception:
                      return None
              return d if d.tzinfo else d.replace(tzinfo=UTC)

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  root = ET.fromstring(r.read())
              items = []
              for el in root.iter():
                  kind = local(el.tag)
                  if kind not in ("item", "entry"):
                      continue
                  title = link = raw = None
                  for ch in el:
                      n = local(ch.tag)
                      if n == "title":
                          title = (ch.text or "").strip()
                      elif n == "link":
                          if ch.get("href"):
                              if ch.get("rel", "alternate") == "alternate" or not link:
                                  link = ch.get("href").strip()
                          elif ch.text and not link:
                              link = ch.text.strip()
                      elif n in ("pubDate", "published", "updated") and not raw:
                          raw = ch.text
                  if title and link:
                      items.append((parse_date(raw), title, link))
              return items

          def load_sent():
              try:
                  return json.load(open(SENT_FILE))
              except Exception:
                  return []

          def collect(sent):
              now = datetime.datetime.now(UTC)
              limit = now - datetime.timedelta(hours=HOURS)
              found = []
              for url in FEEDS:
                  try:
                      found += fetch(url)
                  except Exception as e:
                      print("feed failed:", url, e)
              found = [x for x in found if x[0] and x[0] >= limit and x[2] not in sent]
              if KEYWORDS:
                  found = [x for x in found if any(k.lower() in x[1].lower() for k in KEYWORDS)]
              found.sort(key=lambda x: x[0], reverse=True)
              seen, uniq = set(), []
              for x in found:
                  if x[2] not in seen:
                      seen.add(x[2]); uniq.append(x)
              return uniq

          def send(text):
              token, chat = os.environ["TELEGRAM_BOT_TOKEN"], os.environ["TELEGRAM_CHAT_ID"]
              data = json.dumps({"chat_id": chat, "text": text}).encode()
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=data, headers={"Content-Type": "application/json"},
              )
              urllib.request.urlopen(req, timeout=30).read()

          if __name__ == "__main__":
              sent = load_sent()
              items = collect(sent)
              for _, title, link in items[:MAX_ITEMS]:
                  send(f"💻 {title}\n{link}")
              # mark every fresh item as seen so no backlog builds up
              sent += [x[2] for x in items]
              json.dump(sent[-500:], open(SENT_FILE, "w"))
              print("sent", min(len(items), MAX_ITEMS))
          PYEOF
      - name: Remember what was sent
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add sent.json
          git diff --cached --quiet || (git commit -m "update sent list" && git push)
