name: daily-news
on:
  schedule:
    - cron: "0 5 * * *"   # every day 05:00 UTC (about 08:30 Tehran)
  workflow_dispatch: {}    # manual test button
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send news to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, datetime, email.utils
          import xml.etree.ElementTree as ET

          # ---- settings you can change ----
          FEEDS = ["https://feeds.bbci.co.uk/persian/rss.xml"]  # BBC Persian. Add more RSS links here.
          KEYWORDS = []      # e.g. ["ایران", "تهران"]; empty list = send everything
          MAX_ITEMS = 10     # max news per day
          HOURS = 24         # only news newer than this
          # ---------------------------------

          RLM = "\u200f"  # forces right-to-left alignment in Telegram

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  root = ET.fromstring(r.read())
              items = []
              for it in root.iter("item"):
                  title = (it.findtext("title") or "").strip()
                  link = (it.findtext("link") or "").strip()
                  date = None
                  raw = it.findtext("pubDate")
                  if raw:
                      try:
                          date = email.utils.parsedate_to_datetime(raw)
                          if date.tzinfo is None:
                              date = date.replace(tzinfo=datetime.timezone.utc)
                      except Exception:
                          pass
                  if title and link:
                      items.append((date, title, link))
              return items

          def collect():
              now = datetime.datetime.now(datetime.timezone.utc)
              limit = now - datetime.timedelta(hours=HOURS)
              found = []
              for url in FEEDS:
                  try:
                      found += fetch(url)
                  except Exception as e:
                      print("feed failed:", url, e)
              found = [x for x in found if x[0] is None or x[0] >= limit]
              if KEYWORDS:
                  found = [x for x in found if any(k in x[1] for k in KEYWORDS)]
              found.sort(key=lambda x: x[0] or now, reverse=True)
              return found[:MAX_ITEMS]

          def build_messages(items):
              head = f"{RLM}📰 خبرهای امروز ({datetime.date.today().isoformat()})\n"
              if not items:
                  return [head + f"\n{RLM}خبر تازه‌ای پیدا نشد."]
              msgs, cur = [], head
              for _, title, link in items:
                  block = f"\n{RLM}• {title}\n{link}\n"
                  if len(cur) + len(block) > 3900:
                      msgs.append(cur)
                      cur = ""
                  cur += block
              msgs.append(cur)
              return msgs

          def send(text):
              token, chat = os.environ["TELEGRAM_BOT_TOKEN"], os.environ["TELEGRAM_CHAT_ID"]
              data = json.dumps({"chat_id": chat, "text": text, "disable_web_page_preview": True}).encode()
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=data, headers={"Content-Type": "application/json"},
              )
              urllib.request.urlopen(req, timeout=30).read()

          if __name__ == "__main__":
              for m in build_messages(collect()):
                  send(m)
              print("sent")
          PYEOF
